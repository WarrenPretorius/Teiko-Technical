# Tooling configuration only; dependencies live in requirements.txt.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Starlette's test client warns about its httpx backend; not relevant to these tests.
filterwarnings = ["ignore:Using `httpx`"]
